<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarnZood Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b12;
color:#fff;
}

.app{
max-width:900px;
margin:auto;
padding:20px;
padding-bottom:50px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
font-size:27px;
font-weight:800;
}

.gold{
color:#f4c542;
}

.badge{
background:#171d2a;
border:1px solid #283246;
padding:8px 12px;
border-radius:12px;
font-size:12px;
color:#9ca6b8;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

@media(min-width:650px){

.stats{
grid-template-columns:repeat(4,1fr);
}

}

.stat-card{
background:#111722;
border:1px solid #273247;
border-radius:18px;
padding:20px;
}

.stat-icon{
font-size:27px;
margin-bottom:12px;
}

.stat-title{
font-size:13px;
color:#8994a8;
}

.stat-value{
font-size:25px;
font-weight:bold;
margin-top:7px;
}

.panel{
background:#111722;
border:1px solid #273247;
border-radius:20px;
padding:20px;
margin-top:18px;
}

.panel-title{
font-size:18px;
font-weight:bold;
margin-bottom:18px;
}

.settings{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

@media(min-width:650px){

.settings{
grid-template-columns:1fr 1fr;
}

}

.setting{
background:#0d121c;
border:1px solid #222d40;
padding:15px;
border-radius:15px;
}

.setting label{
display:block;
font-size:13px;
color:#9ca6b8;
margin-bottom:8px;
}

.setting input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #283246;
background:#080b12;
color:#fff;
outline:none;
}

.primary{
width:100%;
margin-top:15px;
padding:14px;
border:0;
border-radius:13px;
background:#f4c542;
color:#080b12;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.primary:active{
transform:scale(.98);
}

.user-search{
display:flex;
gap:8px;
}

.user-search input{
flex:1;
padding:13px;
border-radius:12px;
border:1px solid #283246;
background:#080b12;
color:#fff;
}

.search-btn{
padding:0 18px;
border:0;
border-radius:12px;
background:#f4c542;
font-weight:bold;
}

.user-result{
display:none;
margin-top:15px;
background:#0d121c;
border:1px solid #222d40;
border-radius:15px;
padding:15px;
}

.row{
