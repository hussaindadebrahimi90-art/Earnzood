document.documentElement.dir=
value==="en" ? "ltr" : "rtl";

renderHome();

}

/* =====================================================
   DAILY REWARD
===================================================== */

function claimDaily(){

const t=tr();

const last=Number(
localStorage.getItem(
"earnzood_daily_claim"
) || "0"
);

const now=Date.now();

const cooldown=24*60*60*1000;

if(now-last<cooldown){

const remaining=cooldown-(now-last);

const h=Math.floor(
remaining/3600000
);

const m=Math.floor(
(remaining%3600000)/60000
);

alert(
t.already+
"\n\n"+
t.next+": "+
h+" "+t.hours+" "+
m+" "+t.minutes
);

return;
}

setBalance(
getBalance()+DAILY_REWARD
);

localStorage.setItem(
"earnzood_daily_claim",
now
);

alert(
t.dailySuccess+
"\n\n+$"+
DAILY_REWARD.toFixed(2)
);

renderHome();

}

/* =====================================================
   ADSGRAM
===================================================== */

let AdController=null;

function initAds(){

try{

if(
window.Adsgram &&
typeof window.Adsgram.init==="function"
){

AdController=
window.Adsgram.init({
blockId:ADSGRAM_BLOCK_ID
});

return true;

}

}catch(error){

console.error(error);

}

return false;

}


/* =====================================================
   WATCH AD
===================================================== */

async function watchAd(){

const t=tr();

const count=Number(
localStorage.getItem(
"earnzood_ad_count"
) || "0"
);

if(count>=MAX_ADS){

alert(t.adLimit);

return;

}

const button=
document.getElementById(
"watchAdButton"
);

if(button){

button.disabled=true;

button.textContent="⏳ Loading...";

}

if(!AdController){

initAds();

}

if(!AdController){

if(button){

button.disabled=false;

button.textContent="🎬 "+t.watch;

}

alert(t.adError);

return;

}

try{

const result=
await AdController.show();

console.log(
"AdsGram:",
result
);

if(
result &&
result.done===true
){

const newCount=count+1;

const oldIncome=Number(
localStorage.getItem(
"earnzood_ad_income"
) || "0"
);

const newIncome=
oldIncome+AD_REWARD;

localStorage.setItem(
"earnzood_ad_count",
newCount
);

localStorage.setItem(
"earnzood_ad_income",
newIncome.toFixed(2)
);

setBalance(
getBalance()+AD_REWARD
);

alert(
t.adSuccess+
"\n\n+$"+
AD_REWARD.toFixed(2)
);

renderAds();

}else{

if(button){

button.disabled=false;

button.textContent=
"🎬 "+t.watch;

}

}

}catch(error){

console.error(error);

if(button){

button.disabled=false;

button.textContent=
"🎬 "+t.watch;

}

alert(t.adError);

}

}

/* =====================================================
   ADSGRAM TASK
===================================================== */

function openTask(){

const task=document.createElement(
"adsgram-task"
);

task.setAttribute(
"data-block-id",
TASK_BLOCK_ID
);

task.setAttribute(
"data-debug",
"false"
);

task.style.display="none";

document.body.appendChild(task);

task.addEventListener(
"reward",
function(){

alert(
"🎉 Task completed!"
);

});

task.addEventListener(
"onError",
function(){

alert(
"Task is currently unavailable."
);

});

task.click();

}
