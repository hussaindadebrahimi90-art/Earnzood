<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnZood</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#263652,#080b12 45%);color:#fff;font-family:Arial,sans-serif}
button,select{font:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}
.header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900}.gold{color:#f4c542}
.lang{background:#151c29;color:#fff;border:1px solid #2d3a50;padding:9px 12px;border-radius:13px}
.balance{margin:10px 18px 16px;padding:27px 18px;text-align:center;border-radius:25px;background:linear-gradient(145deg,#1c2739,#0d131e);border:1px solid #30405a;box-shadow:0 12px 35px #0005}
.balance small{color:#9da9bc}.amount{font-size:42px;font-weight:900;margin:8px 0}.currency{color:#f4c542}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:4px 18px}
.card,.panel,.ref{background:#111722eF;border:1px solid #29364b;border-radius:21px;box-shadow:0 7px 22px #0003}
.card{padding:21px 11px;text-align:center;cursor:pointer;transition:.15s}.card:active{transform:scale(.95)}
.icon{font-size:31px;margin-bottom:9px}.card b{display:block;margin-bottom:6px}.card span{font-size:12px;color:#8996aa;line-height:1.5}
.ref{margin:15px 18px;padding:19px}.ref-title{font-weight:bold;margin-bottom:8px}.ref-info{font-size:13px;color:#9ba6b8;line-height:1.7}
.page{padding:18px}.page-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.page-title h2{margin:0;font-size:22px}
.back{background:#17202e;color:#fff;border:1px solid #2d3b50;padding:9px 14px;border-radius:13px;font-size:19px}
.panel{padding:20px;margin-bottom:14px}.center{text-align:center}.big-icon{text-align:center;font-size:57px;margin-bottom:10px}
.reward{font-size:29px;font-weight:900;color:#f4c542;margin:18px 0}
.primary{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#f8d45b,#eeb62b);color:#111;font-weight:900;cursor:pointer}
.primary:disabled{opacity:.5}.secondary{width:100%;padding:14px;border-radius:15px;background:#171f2d;color:#fff;border:1px solid #2d3b50}
.stat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #253044}.stat:last-child{border:0}.stat b{color:#f4c542}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:76px;background:#0d121cf7;backdrop-filter:blur(12px);border-top:1px solid #29364a;display:flex;justify-content:space-around;align-items:center;z-index:99}
.nav button{background:none;border:0;color:#7f8b9e;font-size:11px;padding:6px 12px}.nav button div{font-size:23px;margin-bottom:3px}.nav .active{color:#f4c542}
.taskbox{margin-top:15px}.notice{padding:13px;border-radius:14px;background:#151e2c;border:1px solid #29364a;color:#9ca8ba;font-size:12px;line-height:1.6}
.refcode{background:#090e16;border:1px dashed #3c485d;padding:13px;border-radius:13px;margin:15px 0;font-size:12px;word-break:break-all}
</style>
</head>

<body>
<div class="app" id="app"></div>

<script>
const DAILY=.01,AD=.01,ADS_MAX=5,TASK_REWARD=.02;
const AD_BLOCK="43722",TASK_BLOCK="task-43736";
const TG=window.Telegram?.WebApp;

if(TG){TG.ready();TG.expand()}

const T={
en:{balance:"Your Balance",daily:"Daily Reward",dailySub:"Claim your daily reward",ads:"Advertisements",adsSub:"Earn by watching ads",tasks:"Missions",tasksSub:"Complete tasks and earn rewards",wheel:"Lucky Wheel",wheelSub:"Try your luck",invite:"Invite Friends",inviteText:"Invite friends and earn rewards.",home:"Home",tasksNav:"Tasks",account:"Account",claim:"Claim",received:"Reward received!",already:"Already claimed today.",next:"Next reward",watch:"Watch Advertisement",adsText:"Watch the advertisement until the end and earn.",today:"Today's Ads",income:"Ad Earnings",limit:"Daily ad limit reached.",adError:"Advertisement unavailable.",adOK:"Ad reward received!",tasksTitle:"Missions",tasksText:"Complete the task below and receive your test reward.",taskReward:"Test Reward",taskWait:"Complete the AdsGram task below.",taskOK:"Task reward received!",taskError:"Task unavailable.",none:"No task available.",wheelTitle:"Lucky Wheel",wheelText:"Try your luck.",spin:"SPIN",soon:"Coming soon.",inviteTitle:"Invite Friends",inviteText:"Invite friends using your personal link.",copy:"Copy Invite Link",copied:"Invite link copied!",accountTitle:"Account",referrals:"Referrals",adsWatched:"Ads Watched",user:"Telegram User"},
fa:{balance:"موجودی شما",daily:"پاداش روزانه",dailySub:"پاداش امروز را بگیر",ads:"تبلیغات",adsSub:"با مشاهده تبلیغ درآمد بگیر",tasks:"ماموریت‌ها",tasksSub:"تسک انجام بده و پاداش بگیر",wheel:"گردونه شانس",wheelSub:"شانس خود را امتحان کن",invite:"دعوت دوستان",inviteText:"دوستانت را با لینک اختصاصی دعوت کن.",home:"خانه",tasksNav:"تسک‌ها",account:"حساب",claim:"دریافت",received:"پاداش دریافت شد!",already:"پاداش امروز قبلاً دریافت شده.",next:"دریافت بعدی",watch:"مشاهده تبلیغ",adsText:"تبلیغ را تا پایان ببین و پاداش بگیر.",today:"تبلیغات امروز",income:"درآمد تبلیغات",limit:"سقف تبلیغات امروز تکمیل شده.",adError:"تبلیغ در دسترس نیست.",adOK:"پاداش تبلیغ دریافت شد!",tasksTitle:"ماموریت‌ها",tasksText:"تسک زیر را انجام بده و پاداش آزمایشی بگیر.",taskReward:"پاداش آزمایشی",taskWait:"تسک AdsGram زیر را انجام بده.",taskOK:"پاداش تسک دریافت شد!",taskError:"تسک در دسترس نیست.",none:"تسکی موجود نیست.",wheelTitle:"گردونه شانس",wheelText:"شانس خود را امتحان کن.",spin:"چرخاندن",soon:"به‌زودی فعال می‌شود.",inviteTitle:"دعوت دوستان",inviteText:"دوستانت را با لینک اختصاصی دعوت کن.",copy:"کپی لینک دعوت",copied:"لینک دعوت کپی شد!",accountTitle:"حساب کاربری",referrals:"تعداد دعوت‌ها",adsWatched:"تبلیغات دیده‌شده",user:"کاربر تلگرام"},
ar:{balance:"رصيدك",daily:"المكافأة اليومية",dailySub:"احصل على مكافأتك اليومية",ads:"الإعلانات",adsSub:"اربح من مشاهدة الإعلان",tasks:"المهام",tasksSub:"أنجز المهام واربح",wheel:"عجلة الحظ",wheelSub:"جرب حظك",invite:"دعوة الأصدقاء",inviteText:"ادعُ أصدقاءك عبر رابطك الخاص.",home:"الرئيسية",tasksNav:"المهام",account:"الحساب",claim:"استلام",received:"تم استلام المكافأة!",already:"لقد حصلت على مكافأة اليوم.",next:"المكافأة التالية",watch:"مشاهدة الإعلان",adsText:"شاهد الإعلان حتى النهاية واربح.",today:"إعلانات اليوم",income:"أرباح الإعلانات",limit:"تم الوصول إلى الحد اليومي.",adError:"الإعلان غير متاح.",adOK:"تم استلام مكافأة الإعلان!",tasksTitle:"المهام",tasksText:"أنجز المهمة واحصل على المكافأة التجريبية.",taskReward:"مكافأة تجريبية",taskWait:"أنجز مهمة AdsGram أدناه.",taskOK:"تم استلام مكافأة المهمة!",taskError:"المهمة غير متاحة.",none:"لا توجد مهمة.",wheelTitle:"عجلة الحظ",wheelText:"جرب حظك.",spin:"تدوير",soon:"قريبًا.",inviteTitle:"دعوة الأصدقاء",inviteText:"ادعُ أصدقاءك باستخدام رابطك الخاص.",copy:"نسخ رابط الدعوة",copied:"تم نسخ الرابط!",accountTitle:"الحساب",referrals:"الإحالات",adsWatched:"الإعلانات المشاهدة",user:"مستخدم Telegram"}
};

const lang=()=>localStorage.getItem("earnzood_language")||"en";
const t=()=>T[lang()];
function setLang(x){localStorage.setItem("earnzood_language",x);document.documentElement.lang=x;document.documentElement.dir=x==="en"?"ltr":"rtl";renderHome()}
function bal(){return +(localStorage.getItem("ez_balance")||0)}
function setBal(x){localStorage.setItem("ez_balance",(Math.max(0,x)).toFixed(2))}
function user(){return TG?.initDataUnsafe?.user||null}
function uid(){return user()?.id||"guest"}
function refLink(){return "https://t.me/Earnzood_bot?start=ref_"+uid()}
function nav(a){let x=t();return `<nav class="nav"><button class="${a==="home"?"active":""}" onclick="renderHome()">🏠<div>${x.home}</div></button><button class="${a==="tasks"?"active":""}" onclick="renderTasks()">📋<div>${x.tasksNav}</div></button><button class="${a==="invite"?"active":""}" onclick="renderInvite()">👥<div>${x.invite}</div></button><button class="${a==="account"?"active":""}" onclick="renderAccount()">👤<div>${x.account}</div></button></nav>`}

function header(){return `<header class="header"><div class="logo">Earn<span class="gold">Zood</span></div><select class="lang" onchange="setLang(this.value)"><option value="en" ${lang()=="en"?"selected":""}>English</option><option value="fa" ${lang()=="fa"?"selected":""}>فارسی</option><option value="ar" ${lang()=="ar"?"selected":""}>العربية</option></select></header>`}

function renderHome(){
let x=t();
document.getElementById("app").innerHTML=header()+`
<section class="balance"><small>${x.balance}</small><div class="amount">$${bal().toFixed(2)}</div><small>USD</small></section>
<section class="cards">
<div class="card" onclick="claimDaily()">🎁<div class="icon"></div><b>${x.daily}</b><span>${x.dailySub}</span></div>
<div class="card" onclick="renderAds()">📺<div class="icon"></div><b>${x.ads}</b><span>${x.adsSub}</span></div>
<div class="card" onclick="renderTasks()">📋<div class="icon"></div><b>${x.tasks}</b><span>${x.tasksSub}</span></div>
<div class="card" onclick="renderWheel()">🎡<div class="icon"></div><b>${x.wheel}</b><span>${x.wheelSub}</span></div>
</section>
<section class="ref"><div class="ref-title">${x.inviteTitle}</div><div class="ref-info">${x.inviteText}</div></section>${nav("home")}`;
}

function claimDaily(){
let x=t(),last=+(localStorage.getItem("ez_daily")||0),now=Date.now();
if(now-last<86400000){let r=86400000-(now-last),h=Math.floor(r/36e5),m=Math.floor(r%36e5/6e4);return alert(x.already+"\n\n"+x.next+": "+h+"h "+m+"m")}
setBal(bal()+DAILY);localStorage.setItem("ez_daily",now);alert(x.received+"\n\n+$"+DAILY.toFixed(2));renderHome()
}

let AdController=null;
function initAds(){try{AdController=window.Adsgram?.init({blockId:AD_BLOCK})}catch(e){console.error(e)}}
async function watchAd(){
let x=t(),c=+(localStorage.getItem("ez_ads")||0);
if(c>=ADS_MAX)return alert(x.limit);
if(!AdController)initAds();
if(!AdController)return alert(x.adError);
try{
let r=await AdController.show();
if(r?.done===true){localStorage.setItem("ez_ads",c+1);localStorage.setItem("ez_ad_income",(+(localStorage.getItem("ez_ad_income")||0)+AD).toFixed(2));setBal(bal()+AD);alert(x.adOK+"\n\n+$"+AD.toFixed(2));renderAds()}
}catch(e){console.error(e);alert(x.adError)}
}

function renderAds(){
let x=t(),c=+(localStorage.getItem("ez_ads")||0),i=+(localStorage.getItem("ez_ad_income")||0);
document.getElementById("app").innerHTML=`<div class="page"><div class="page-title"><button class="back" onclick="renderHome()">←</button><h2>${x.ads}</h2></div><div class="panel center"><div class="big-icon">📺</div><h3>${x.watch}</h3><p style="color:#9ca6b8">${x.adsText}</p><div class="reward">+$${AD.toFixed(2)}</div><button class="primary" onclick="watchAd()">🎬 ${x.watch}</button></div><div class="panel"><div class="stat"><span>📊 ${x.today}</span><b>${c}/${ADS_MAX}</b></div><div class="stat"><span>💰 ${x.income}</span><b>$${i.toFixed(2)}</b></div></div>${nav("home")}</div>`
}

function renderTasks(){
let x=t();
document.getElementById("app").innerHTML=`<div class="page"><div class="page-title"><button class="back" onclick="renderHome()">←</button><h2>${x.tasksTitle}</h2></div><div class="panel center"><div class="big-icon">📋</div><p style="color:#9ca6b8">${x.tasksText}</p><div class="reward">+$${TASK_REWARD.toFixed(2)}</div></div><div id="taskBox" class="taskbox"></div>${nav("tasks")}</div>`;
let box=document.getElementById("taskBox");
box.innerHTML=`<adsgram-task data-block-id="${TASK_BLOCK_ID}" data-debug="true" data-debug-console="false" class="task"></adsgram-task>`;
let task=box.querySelector("adsgram-task");
task.addEventListener("reward",()=>{setBal(bal()+TASK_REWARD);alert(x.taskOK+"\n\n+$"+TASK_REWARD.toFixed(2));renderTasks()});
task.addEventListener("onError",()=>alert(x.taskError));
task.addEventListener("onBannerNotFound",()=>alert(x.none));
task.addEventListener("onTooLongSession",()=>alert("Please restart the Mini App."));
}

function renderWheel(){
let x=t();document.getElementById("app").innerHTML=`<div class="page"><div class="page-title"><button class="back" onclick="renderHome()">←</button><h2>${x.wheelTitle}</h2></div><div class="panel center"><div class="big-icon">🎡</div><p style="color:#9ca6b8">${x.wheelText}</p><div class="reward">🎁 ?</div><button class="primary" onclick="alert('${x.soon}')">🎡 ${x.spin}</button></div>${nav("home")}</div>`
}

function copyInvite(){
navigator.clipboard?.writeText(refLink()).then(()=>alert(t().copied)).catch(()=>prompt("Referral link:",refLink()))
}
function renderInvite(){
let x=t();document.getElementById("app").innerHTML=`<div class="page"><div class="page-title"><button class="back" onclick="renderHome()">←</button><h2>${x.invite}</h2></div><div class="panel center"><div class="big-icon">👥</div><p style="color:#9ca6b8">${x.inviteText}</p><div class="refcode">${refLink()}</div><button class="primary" onclick="copyInvite()">🔗 ${x.copy}</button></div>${nav("invite")}</div>`
}

function renderAccount(){
let x=t(),u=user(),a=+(localStorage.getItem("ez_ads")||0);
document.getElementById("app").innerHTML=`<div class="page"><div class="page-title"><button class="back" onclick="renderHome()">←</button><h2>${x.accountTitle}</h2></div><div class="panel"><div class="stat"><span>💰 ${x.balance}</span><b>$${bal().toFixed(2)}</b></div><div class="stat"><span>👥 ${x.referrals}</span><b>0</b></div><div class="stat"><span>📺 ${x.adsWatched}</span><b>${a}</b></div><div class="stat"><span>👤 ${x.user}</span><b>${u?.first_name||"Guest"}</b></div></div>${nav("account")}</div>`
}

document.documentElement.lang=lang();
document.documentElement.dir=lang()==="en"?"ltr":"rtl";
initAds();
renderHome();
</script>
</body>
</html>
