<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>EarnZood</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b12;
color:#fff;
}

button{
font-family:inherit;
}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
padding-bottom:90px;
}

.header{
padding:20px 18px 10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:25px;
font-weight:800;
}

.gold{
color:#f4c542;
}

.lang{
background:#171d2a;
border:1px solid #283246;
color:#fff;
padding:8px 11px;
border-radius:12px;
}

.balance{
margin:12px 18px;
padding:24px;
border-radius:22px;
background:linear-gradient(135deg,#171d2b,#101521);
border:1px solid #273247;
text-align:center;
}

.balance small{
color:#9ca6b8;
}

.amount{
font-size:38px;
font-weight:800;
margin:8px 0;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:8px 18px;
}

.card{
background:#111722;
border:1px solid #222d40;
border-radius:19px;
padding:20px 12px;
text-align:center;
cursor:pointer;
transition:.15s;
}

.card:active{
transform:scale(.96);
}

.icon{
font-size:30px;
margin-bottom:9px;
}

.card b{
display:block;
margin-bottom:6px;
}

.card span{
font-size:12px;
color:#8994a8;
}

.ref{
margin:12px 18px;
padding:18px;
background:#111722;
border:1px solid #222d40;
border-radius:19px;
}

.ref-title{
font-weight:bold;
margin-bottom:8px;
}

.ref-info{
font-size:13px;
color:#9ba5b6;
}

.nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:72px;
background:#0d121c;
border-top:1px solid #222c3c;
display:flex;
justify-content:space-around;
align-items:center;
z-index:100;
}

.nav button{
background:none;
border:0;
color:#8e98aa;
font-size:12px;
cursor:pointer;
}

.nav button div{
font-size:22px;
margin-bottom:3px;
}

.nav .active{
color:#f4c542;
}

.page{
padding:20px;
}

.back{
background:#171d2a;
border:1px solid #283246;
color:white;
padding:10px 14px;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

.page-title{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px;
}

.panel{
background:#111722;
border:1px solid #273247;
border-radius:22px;
padding:22px;
margin-bottom:15px;
}

.big-icon{
font-size:55px;
text-align:center;
margin-bottom:12px;
}

.center{
text-align:center;
}

.reward{
font-size:28px;
font-weight:bold;
color:#f4c542;
margin:20px 0;
}

.primary{
width:100%;
padding:15px;
border:0;
border-radius:15px;
background:#f4c542;
color:#080b12;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.secondary{
width:100%;
padding:14px;
border:1px solid #283246;
border-radius:15px;
background:#171d2a;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.stat{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #222d40;
}

.stat:last-child{
border-bottom:0;
}

</style>

</head>

/* =========================
   SETTINGS
========================= */

const DAILY_REWARD=0.01;

const MAX_ADS=5;


/* =========================
   LANGUAGE
========================= */

function lang(){

return localStorage.getItem("earnzood_language") || "fa";

}

function tr(){

return T[lang()];

}

function setLang(value){

localStorage.setItem(
"earnzood_language",
value
);

document.documentElement.lang=value;

document.documentElement.dir=
value==="en" ? "ltr" : "rtl";

renderHome();

}


/* =========================
   BALANCE
========================= */

function getBalance(){

return Number(
localStorage.getItem("earnzood_balance") || "0"
);

}

function setBalance(value){

localStorage.setItem(
"earnzood_balance",
Number(value).toFixed(2)
);

}

function updateBalance(){

const el=
document.getElementById("balanceAmount");

if(el){

el.textContent=
"$"+getBalance().toFixed(2);

}

}


/* =========================
   HOME
========================= */

function renderHome(){

const t=tr();

document.getElementById("app").innerHTML=`

<header class="header">

<div class="logo">
Earn<span class="gold">Zood</span>
</div>

<select class="lang"
onchange="setLang(this.value)">

<option value="fa"
${lang()==="fa"?"selected":""}>
فارسی
</option>

<option value="en"
${lang()==="en"?"selected":""}>

id="balanceAmount">
$${getBalance().toFixed(2)}
</div>

onclick="claimDaily()">

${t.inviteText}
</div>

</section>


<nav class="nav">

<button class="active"
onclick="renderHome()">

<div>🏠</div>

<span>${t.home}</span>

</button>

<button
onclick="renderTasks()">

<div>📋</div>

<span>${t.tasksNav}</span>

</button>

onclick="renderInvite()">

<div>👥</div>

<span>${t.invite}</span>

</button>

<button
onclick="renderAccount()">

<div>👤</div>

<span>${t.account}</span>

</button>

</nav>

`;

}


/* =========================
   DAILY REWARD
========================= */

function claimDaily(){

const t=tr();

const last=
Number(
localStorage.getItem(
"earnzood_daily_claim"
) || "0"
);

const now=Date.now();

const cooldown=
24*60*60*1000;

if(now-last<cooldown){

const remaining=
cooldown-(now-last);

const h=
Math.floor(
remaining/3600000
);

const m=
Math.floor(
(remaining%3600000)/60000
);

alert(
t.already+
"\n\n"+
t.next+": "+
h+" "+t.hours+" "+
m+" "+t.minutes
);

return;

}


const newBalance=
getBalance()+DAILY_REWARD;

setBalance(newBalance);

localStorage.setItem(
"earnzood_daily_claim",
now
);

alert(
t.dailySuccess+
"\n\n+$"+
DAILY_REWARD.toFixed(2)
);

renderHome();

}

/* =========================

========================= */

function watchAd(){

const count=
Number(
localStorage.getItem(
"earnzood_ad_count"
) || "0"
);

if(count>=MAX_ADS){

alert(
"Daily ad limit reached."
);

return;

}

alert(
"🎬 Test advertisement\n\nAdsGram will be connected here later."
);

}
